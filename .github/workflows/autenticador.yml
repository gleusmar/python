name: Autenticador Guias

on:
  workflow_dispatch:  # Permite execução manual
  schedule:
    - cron: '0 8 * * 1-5'  # Executa de segunda a sexta às 8h (horário UTC)

jobs:
  autenticar:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          sudo apt-get install -y chromium-chromedriver
      
      - name: Setup credentials
        env:
          CREDENTIALS3_JSON: ${{ secrets.CREDENTIALS3_JSON }}
          CREDENTIALS_FILE: ${{ secrets.CREDENTIALS_FILE }}
        run: |
          echo "$CREDENTIALS3_JSON" > credentials3.json
          echo "CREDENTIALS_FILE=credentials3.json" >> $GITHUB_ENV
      
      - name: Run autenticador
        env:
          USUARIO: ${{ secrets.USUARIO }}
          SENHA: ${{ secrets.SENHA }}
        run: |
          python test.py
        timeout-minutes: 360  # 6 horas (limite máximo do GitHub Actions)
