name: Autenticador Guias

on:
  workflow_dispatch:  # Permite execução manual
  schedule:
    - cron: '0 8 * * 1-5'  # Executa de segunda a sexta às 8h (horário UTC)

jobs:
  autenticar:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Check preinstalled Chrome
        run: |
          google-chrome --version
      
      - name: Setup credentials
        env:
          CREDENTIALS3_JSON: ${{ secrets.CREDENTIALS3_JSON }}
          CREDENTIALS_FILE: ${{ secrets.CREDENTIALS_FILE }}
        run: |
          echo "$CREDENTIALS3_JSON" > credentials3.json
          echo "CREDENTIALS_FILE=credentials3.json" >> $GITHUB_ENV
      
      - name: Test connectivity to MV server
        run: |
          curl -v --max-time 30 -o /dev/null "http://2896prd.cloudmv.com.br/sigss" || true
      
      - name: Run autenticador
        env:
          USUARIO: ${{ secrets.USUARIO }}
          SENHA: ${{ secrets.SENHA }}
        run: |
          python test.py
        timeout-minutes: 360  # 6 horas (limite máximo do GitHub Actions)
      
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: |
            login_timeout.png
            login_timeout.html
          if-no-files-found: ignore
